<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Data Scientist</title>
</head>
<body style="background:#0a0c12;color:white;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0">
<div style="text-align:center">
<h1>Auto Data Scientist</h1>
<p>If you can see this, the server is working.</p>
<p id="status">Checking API...</p>
<script>
fetch('/api/health').then(r=>r.json()).then(d=>{
document.getElementById('status').textContent='API OK: '+JSON.stringify(d);
}).catch(e=>{
document.getElementById('status').textContent='API Error: '+e.message;
});
</script>
</div>
</body>
</html>
